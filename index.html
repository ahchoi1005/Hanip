<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한입 기록장</title>
<meta name="theme-color" content="#1F5C52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한입">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#1C2B28; --muted:#5E6E69; --line:#DCE3DE;
  --accent:#1F5C52; --accent-ink:#FFFFFF; --soft:#E4EEEA;
  --gold:#D99A12; --gold-ink:#2E2100; --t3:#6FA85A; --t2:#C2A865; --t1:#C0705F;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 6px 20px rgba(20,40,35,.08);
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111715; --surface:#19221F; --ink:#E6EEEA; --muted:#94A49F; --line:#2A3633;
  --accent:#6FC2B0; --accent-ink:#0D1F1B; --soft:#1F2E2A;
  --gold:#F0B63A; --gold-ink:#221800; --t3:#8CC476; --t2:#BFA86E; --t1:#D98270;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-inline:max(16px,env(safe-area-inset-left));padding-block:env(safe-area-inset-top,0px) calc(110px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1100px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;letter-spacing:.5px;line-height:1.1}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;padding:10px 14px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.chip.add{border-style:dashed;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-block:4px 10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13px;padding:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.card .ph{aspect-ratio:4/3;background:var(--soft);position:relative;max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:40px;color:var(--muted)}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .t{font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.card .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.score{position:absolute;right:8px;top:8px}
.badge{font-family:var(--f-num);font-weight:800;font-variant-numeric:tabular-nums;border-radius:10px;padding:3px 9px;font-size:17px;line-height:1.2;display:inline-flex;align-items:baseline;gap:2px;background:var(--surface);color:var(--ink);border:1px solid var(--line);flex:none}
.badge small{font-size:11px;font-weight:600;opacity:.7}
.badge.t4{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.badge.t3{border-color:var(--t3);box-shadow:inset 0 -3px 0 var(--t3)}
.badge.t2{border-color:var(--t2);box-shadow:inset 0 -3px 0 var(--t2)}
.badge.t1{border-color:var(--t1);box-shadow:inset 0 -3px 0 var(--t1)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:12px;background:var(--soft);border-radius:6px;padding:1px 7px;color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.rrow .main{flex:1;min-width:0}
.rrow .t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.rrow .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--ink);margin:0 0 6px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--t1);border:1px solid var(--t1)}
.btn.danger.arm{background:var(--t1);color:var(--surface)}
.btn:disabled{opacity:.6}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);border-radius:999px;padding:14px 22px;font-size:16px;z-index:500}
#mapwrap{height:calc(100vh - 230px);min-height:360px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#map{height:100%;width:100%}
.leaflet-container{font-family:var(--f-body)}
.leaflet-interactive.pin{filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.pin-label{font-family:var(--f-body);font-weight:600;font-size:12px;border:0;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.pop-t{font-weight:600;font-size:14px}
.ov{position:fixed;inset:0;z-index:1000;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-inline:max(16px,env(safe-area-inset-left));padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
.ov .wrap{max-width:720px}
.ovhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px 12px;position:sticky;top:0;background:var(--bg);z-index:2}
.ovhead h2{font-size:17px;margin:0;font-weight:600}
.back{border:0;background:none;font-size:15px;color:var(--accent);padding:6px 0}
.dtitle{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;margin:4px 0 6px;overflow-wrap:anywhere}
.addr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;user-select:text}
.stat{display:flex;gap:16px;margin-block:12px;align-items:center;flex-wrap:wrap}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.dish .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dish .t{font-weight:600;font-size:16px;overflow-wrap:anywhere;min-width:0}
.dish .meta{font-size:13px;color:var(--muted)}
.dish .note{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.strip{display:flex;gap:8px;overflow-x:auto}
.strip img{height:120px;width:auto;border-radius:10px;flex:none;cursor:zoom-in;max-width:none;background:var(--soft)}
.hero{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;display:block;background:var(--soft);cursor:zoom-in;max-width:100%}
.hero-empty{width:100%;aspect-ratio:16/7;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-family:var(--f-display);font-size:56px;color:var(--muted)}
.dv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:14px}
.dv-head .dtitle{margin:0}
.dv-head .badge{font-size:24px;padding:5px 12px}
.restlink{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.restlink .t{font-weight:600;overflow-wrap:anywhere}.restlink .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.dv-note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.sec{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px;font-weight:600}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;position:relative}
.f label,.f .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
textarea.in{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 0;font-family:var(--f-num);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.rate button.fill{background:var(--soft)}
.rate button.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.ratehint{font-size:13px;color:var(--muted);font-weight:400}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.sug button{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:9px 12px}
.sug button:last-child{border-bottom:0}
.sug small{color:var(--muted);display:block;overflow-wrap:anywhere}
.sug .hdr{font-size:11px;letter-spacing:.06em;color:var(--muted);padding:6px 12px;background:var(--soft)}
.picked{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:10px 12px}
.picked .t{font-weight:600;overflow-wrap:anywhere}
.picked .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.help{font-size:12px;color:var(--muted)}
.phs{display:flex;flex-wrap:wrap;gap:8px}
.phs .p{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--soft)}
.phs .p img{width:100%;height:100%;object-fit:cover}
.phs .p button{position:absolute;top:3px;right:3px;border:0;border-radius:999px;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.phs label.addp{width:84px;height:84px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:pointer;text-align:center;background:var(--surface)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.actions .grow{flex:1}
.err{color:var(--t1);font-size:14px;min-height:1.2em}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;display:grid;place-items:center;padding:16px}
.lb img{max-height:100%;max-width:100%;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:4000;max-width:calc(100% - 32px);text-align:center}
.note-box{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.meter{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:40px}
@media (max-width:440px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card .t{font-size:15px}.badge{font-size:15px}}
</style>
</head>
<body>
<div id="boot" class="wrap"><div class="empty" style="margin-top:20vh">불러오는 중…</div></div>

<div id="login" class="wrap" hidden>
  <form class="login" id="loginform">
    <h1>한입 기록장</h1>
    <p class="help" style="margin:0">Supabase에 만든 계정으로 로그인하세요.</p>
    <input id="lg-email" class="in" type="email" autocomplete="username" placeholder="이메일" required>
    <input id="lg-pw" class="in" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <button class="btn" id="lg-btn" type="submit">로그인</button>
    <div class="err" id="lg-err"></div>
  </form>
</div>

<div id="app" class="wrap" hidden>
  <header class="top">
    <h1>한입 기록장</h1>
    <button class="btn ghost small" data-a="settings">설정 · 백업</button>
  </header>
  <nav class="tabs">
    <button id="tab-dishes" data-a="tab" data-v="dishes">메뉴</button>
    <button id="tab-rests" data-a="tab" data-v="rests">식당 · 리스트</button>
    <button id="tab-map" data-a="tab" data-v="map">지도</button>
  </nav>
  <input id="q" class="search" type="search" placeholder="메뉴, 식당, 주소, 태그 검색" autocomplete="off">
  <div id="filters"></div>
  <div id="list"></div>
  <div id="mapwrap" hidden><div id="map"></div></div>
</div>
<button class="btn fab" data-a="add" id="fab" hidden>+ 기록하기</button>
<section id="detail" class="ov" hidden></section>
<section id="dview" class="ov" hidden></section>
<section id="sheet" class="ov" hidden></section>
<div id="lb" class="lb" hidden data-a="lbclose"><img id="lbimg" alt=""></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
