# Supabase 무료 프로젝트가 일주일 비활성으로 pause되지 않도록
# 3일마다 DB에 가벼운 조회를 한 번 보냅니다.
# URL과 키는 config.js에서 자동으로 읽어오므로 따로 설정할 것이 없습니다.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 15 */3 * *"   # 3일마다 (UTC 15:17)
  workflow_dispatch:           # Actions 탭에서 수동 실행 가능

permissions:
  contents: read
  actions: write   # 아래 마지막 단계가 이 워크플로를 계속 켜 두는 데 필요

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          URL=$(grep -oE 'SUPABASE_URL:[[:space:]]*"[^"]+"' config.js | sed -E 's/.*"([^"]+)"/\1/')
          KEY=$(grep -oE 'SUPABASE_ANON_KEY:[[:space:]]*"[^"]+"' config.js | sed -E 's/.*"([^"]+)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js에서 Supabase URL/키를 찾지 못했습니다." >&2
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase 응답 코드: $STATUS"
          if [ "$STATUS" -ge 400 ]; then
            echo "Supabase가 응답하지 않습니다. 이미 pause된 상태인지 대시보드를 확인하세요." >&2
            exit 1
          fi

      # GitHub는 60일 동안 저장소에 변화가 없으면 예약 실행을 자동으로 끕니다.
      # 실행할 때마다 이 워크플로를 다시 '켜기' 상태로 만들어 그걸 막습니다.
      - name: Keep workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
